name: Render on home PC

on:
  push:
    branches: [main]
    paths: ["generator/questions.json"]   # new quizzes from the weekly task -> render them on the PC
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: render the first quiz to a temp folder and attach it to the run (commits nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, render-pc]   # Jack's home PC; if the queue runs dry the daily post renders in the cloud
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash by full path: plain "bash" resolves to the WSL stub in System32 for the runner service
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      PYTHONUTF8: "1"   # Windows defaults to cp1252
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false   # keep the downloaded voice model between runs

      - name: Python environment for this repo
        # each repo gets its own venv, so the two runners never pip-install into the same folder at once
        run: |
          [ -x .venv/Scripts/python.exe ] || python -m venv .venv
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"

      - name: Find ffmpeg
        # the runner service may not see ffmpeg on PATH, so look in the usual install folders too
        run: |
          for d in /c/ffmpeg/bin "/c/Program Files/WinGet/Packages"/Gyan.FFmpeg*/*/bin; do
            if [ -f "$d/ffmpeg.exe" ]; then
              "$d/ffmpeg.exe" -hide_banner -version | head -1
              cygpath -w "$d" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          command -v ffmpeg || { echo "::error::ffmpeg is not installed on the home PC"; exit 1; }

      - name: Setup (fast after the first run)
        run: bash generator/setup.sh

      - name: Test render (commits nothing)
        if: inputs.test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          python generator/produce.py --start 1 --end 2 --dry-run | tee test.log   # quiz 1 = turbo voice, quiz 2 = hype voice
          out=$(sed -n 's/^Dry run done. Output in //p' test.log)
          rm -rf test-render prev && mkdir -p test-render prev && cp "$out"/*.mp4 test-render/
          # small previews on the test-previews branch, so a cloud session can check them
          for f in test-render/*.mp4; do
            ffmpeg -v error -y -i "$f" -vf scale=540:-2 -c:v libx264 -crf 28 -preset veryfast -c:a aac -b:a 96k "prev/$(basename "$f")"
          done
          (cd prev && git init -q && git checkout -q -b test-previews && git add . \
            && git -c user.name=mindsnack-bot -c user.email=actions@users.noreply.github.com commit -qm "Test previews" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-previews)
          echo "Test render of quizzes 1-2 took $(( $(date +%s) - start ))s on the home PC." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.test
        with:
          name: test-render
          path: test-render/

      - name: Render every quiz not queued yet
        if: ${{ !inputs.test }}
        run: python generator/produce.py --new

      - name: Save the videos and queue
        if: ${{ !inputs.test }}
        run: |
          if [ -n "$(git status --porcelain videos queue.json)" ]; then
            git config user.name "mindsnack-bot"
            git config user.email "actions@users.noreply.github.com"
            git add videos queue.json
            git commit -m "Render new quizzes on home PC"
            git pull --rebase --autostash
            git push
            echo "Rendered new quizzes on the home PC." >> "$GITHUB_STEP_SUMMARY"
          fi
