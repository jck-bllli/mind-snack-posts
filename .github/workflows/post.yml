name: Post daily Reel

on:
  schedule:
    - cron: "17 23 * * *"   # every day 23:17 UTC = 4:17pm Pacific / 7:17pm Eastern (DST)
    - cron: "47 0 * * *"    # backup 00:47 UTC = 5:47pm Pacific, in case GitHub skips the first (it skips if one already posted)
  push:
    branches: [main]
    paths: ["post_now.txt"]   # editing this file posts the next video immediately
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test only, post = publish the next video now"
        required: true
        default: check
        type: choice
        options: [check, post]

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Backup render in the cloud (only if the queue ran dry and the home PC has quizzes waiting)
        if: github.event_name == 'schedule'
        id: fallback
        run: |
          python - <<'EOF'
          import json, os
          queue = json.load(open("queue.json"))
          posted = {p["id"] for p in json.load(open("posted.json"))}
          quizzes = json.load(open("generator/questions.json"))
          queued = {q["id"] for q in queue}
          empty = all(q["id"] in posted for q in queue)
          waiting = any(f"quiz_{n}" not in queued for n in range(len(quizzes)))
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"need={'yes' if empty and waiting else ''}\n")
          EOF

      - name: Render in the cloud (backup only)
        if: steps.fallback.outputs.need
        run: |
          echo "::warning::The queue ran dry before the home PC rendered the new quizzes, so the cloud rendered them. Check the PC is on and its runner is Idle."
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          bash generator/setup.sh
          python generator/produce.py --new
          git config user.name "mindsnack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos queue.json
          git commit -m "Backup render in the cloud"
          git pull --rebase --autostash
          git push   # the video must be on GitHub before Instagram can fetch it

      - name: Post (or check)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/new_token
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "check" ]; then
            python post_next.py --check
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python post_next.py --once-per-day
          else
            python post_next.py
          fi
      - name: Save renewed Instagram token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/new_token
        run: |
          if [ -s "$NEW_TOKEN_FILE" ]; then
            echo "::add-mask::$(cat "$NEW_TOKEN_FILE")"
            if [ -z "$GH_TOKEN" ]; then
              echo "::warning::Meta issued a new Instagram token but the GH_PAT secret is missing, so it could not be saved. Add GH_PAT (see README)."
            else
              gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$NEW_TOKEN_FILE"
              echo "Saved the renewed token to IG_ACCESS_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$NEW_TOKEN_FILE"
          fi
      - name: Record what was posted
        run: |
          if [ -n "$(git status --porcelain posted.json queue.json videos)" ]; then
            git config user.name "mindsnack-bot"
            git config user.email "actions@users.noreply.github.com"
            git add posted.json queue.json videos
            git commit -m "Posted next Reel"
            git push
          fi
