<!DOCTYPE html>
<html><head><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"http://local/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// Sag Harbor, built from OpenStreetMap footprints + USGS NAIP aerial.
// Local meters: x = east, z = south, origin = Main St / Bay St at the foot of Long Wharf.
const Q = new URLSearchParams(location.search);
const OVERHEAD = Q.has('overhead'), NOAERIAL = Q.has('noaerial');
const W = 540, H = 960;
const renderer = new THREE.WebGLRenderer({antialias:false, preserveDrawingBuffer:true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = !OVERHEAD; renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

let seed = 4242;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a,b) => a + (b-a)*rnd();
const pick = a => a[(rnd()*a.length)|0];
const smooth = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };

function canvasTex(w, h, draw, rep, nearest=true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapLinearFilter; }
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

const D = await (await fetch('http://local/sh_data.json')).json();
const aerialImg = await loadImg('http://local/aerial.jpg');
const [LAT0, LON0] = D.origin;
// aerial bounds in local meters
const AX0 = (D.bbox[1]-LON0)*D.kx, AX1 = (D.bbox[3]-LON0)*D.kx;
const AZ0 = -(D.bbox[2]-LAT0)*D.ky, AZ1 = -(D.bbox[0]-LAT0)*D.ky; // north edge, south edge
const AW = aerialImg.width, AH = aerialImg.height;
const toPx = (x,z) => [(x-AX0)/(AX1-AX0)*AW, (z-AZ0)/(AZ1-AZ0)*AH];
const aUV = (x,z) => [(x-AX0)/(AX1-AX0), 1-(z-AZ0)/(AZ1-AZ0)];

const scene = new THREE.Scene();
const FOG = new THREE.Color('#f3c38f');
scene.fog = new THREE.Fog(FOG, 120, 1100);
const camera = new THREE.PerspectiveCamera(68, W/H, 0.3, 6000);

// ---------- shared uniforms ----------
const U = { uTime:{value:0}, uBreathe:{value:0}, uDrip:{value:0}, uKal:{value:0}, uTrip:{value:0} };

// ---------- lights: golden hour, sun low in the WNW ----------
const sunDir = new THREE.Vector3(-0.93, 0.2, -0.3).normalize();
const sun = new THREE.DirectionalLight('#ffbf73', 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-140, right:140, top:140, bottom:-140, near:1, far:900});
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight('#a8c6ec', '#7a6646', 1.6));
scene.add(new THREE.AmbientLight('#ffd9b0', 0.35));

// ---------- sky dome (golden hour -> kaleidoscope) ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { ...U, uSun: {value: sunDir} },
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position.z = gl_Position.w; }`,
  fragmentShader: `uniform float uTime,uKal; uniform vec3 uSun; varying vec3 vD;
  float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
  float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*n(p); p*=2.03; a*=.5; } return s; }
  vec3 pal(float t){ return .5+.5*cos(6.2832*(t+vec3(0.,.33,.67))); }
  void main(){
    vec3 d = normalize(vD); float y = max(d.y, 0.);
    vec3 col = mix(vec3(1.,.78,.5), vec3(.98,.62,.42), smoothstep(.0,.08,y));
    col = mix(col, vec3(.55,.68,.86), smoothstep(.06,.5,y));
    col = mix(col, vec3(.33,.5,.8), smoothstep(.5,1.,y));
    float s = max(dot(d, uSun), 0.);
    col += vec3(1.,.7,.35)*pow(s, 8.)*.55 + vec3(1.,.93,.75)*smoothstep(.9985,.9992,s);
    vec2 cp = d.xz/(d.y+.25);
    float cl = smoothstep(.55,.8, fbm(cp*1.6+vec2(uTime*.02,0.)));
    vec3 cc = mix(vec3(1.,.86,.72), vec3(1.,.55,.4), pow(s,2.));
    col = mix(col, cc, cl*.75*smoothstep(.02,.15,d.y));
    if (uKal > 0.) {
      vec2 p = d.xz/(d.y+.35);
      float r = length(p), a = atan(p.y,p.x) + uTime*.35;
      float seg = 6.2832/12.; a = mod(a, seg); a = abs(a - seg*.5);
      vec2 q = vec2(cos(a), sin(a))*r;
      float v = fbm(q*3. + uTime*.4) + .5*sin(r*9. - uTime*3.) + .3*sin(q.x*14.+uTime);
      vec3 k = pal(v*.9 + r*.3 - uTime*.25);
      k *= .8 + .4*smoothstep(.2,.0,abs(fract(v*3.)-.5)-.3);
      col = mix(col, k, uKal*smoothstep(-.05,.25,d.y));
    }
    gl_FragColor = vec4(pow(col, vec3(2.2)),1.);
  }`
}));
sky.renderOrder = -1; scene.add(sky);

// ---------- textures ----------
const SIDING = [
  {c:'#f2eee4', l:'#d8d2c4', trim:'#ffffff', sh:'#2d3a33', kind:'clap'},
  {c:'#f6f1e6', l:'#dcd5c6', trim:'#ffffff', sh:'#1f2b3f', kind:'clap'},
  {c:'#a39684', l:'#857867', trim:'#f4f0e8', sh:null, kind:'shingle'},
  {c:'#8f8576', l:'#746a5c', trim:'#ffffff', sh:null, kind:'shingle'},
  {c:'#efe1ae', l:'#d4c48e', trim:'#ffffff', sh:'#2d3a33', kind:'clap'},
  {c:'#b8c4ac', l:'#9aa78f', trim:'#ffffff', sh:null, kind:'clap'},
  {c:'#9c4a34', l:'#7c3826', trim:'#efe6d6', sh:null, kind:'brick'},
  {c:'#3e4c63', l:'#2f3b4e', trim:'#f4f0e8', sh:null, kind:'clap'},
  {c:'#8c3d30', l:'#6f2d23', trim:'#f4ece0', sh:null, kind:'clap'},
];
function sidingBase(g, s, w, h) {
  g.fillStyle = s.c; g.fillRect(0,0,w,h);
  if (s.kind === 'clap') { g.fillStyle = s.l; for (let y=3;y<h;y+=4) g.fillRect(0,y,w,1); }
  if (s.kind === 'shingle') { for (let y=0;y<h;y+=5) for (let x=(y/5%2)*3;x<w;x+=6) { g.fillStyle = `rgba(0,0,0,${R(.05,.2)})`; g.fillRect(x,y,5,4); g.fillStyle = s.l; g.fillRect(x,y+4,6,1); } }
  if (s.kind === 'brick') { for (let y=0;y<h;y+=4) { g.fillStyle = '#c9b9a4'; g.fillRect(0,y+3,w,1); for (let x=(y/4%2)*4;x<w;x+=8) { g.fillRect(x,y,1,3); g.fillStyle=`rgba(40,10,0,${R(0,.25)})`; g.fillRect(x+1,y,7,3); g.fillStyle='#c9b9a4'; } } }
}
function glass(g, x, y, w, h) {
  const gr = g.createLinearGradient(x, y, x+w, y+h);
  gr.addColorStop(0, '#3a4e63'); gr.addColorStop(.45, '#ffd08a'); gr.addColorStop(.6, '#9a6a52'); gr.addColorStop(1, '#22303f');
  g.fillStyle = gr; g.fillRect(x, y, w, h);
}
const wallTex = SIDING.map(s => canvasTex(64, 64, (g,w,h) => {
  sidingBase(g, s, w, h);
  g.fillStyle = s.trim; g.fillRect(20, 14, 24, 36);
  glass(g, 23, 17, 18, 30);
  g.fillStyle = s.trim; g.fillRect(31, 17, 2, 30); g.fillRect(23, 31, 18, 2);
  g.fillRect(18, 49, 28, 3);
  if (s.sh) { g.fillStyle = s.sh; g.fillRect(12, 15, 7, 34); g.fillRect(45, 15, 7, 34); g.fillStyle='rgba(255,255,255,.12)'; for (let y=17;y<48;y+=3) { g.fillRect(13,y,5,1); g.fillRect(46,y,5,1); } }
}, [1,1]));
const STORE = ['#20402f', '#1d2b45', '#121212', '#7a1f1f', '#2f5d6b', '#5b3a24', '#f2eee4'];
const storeTex = STORE.map(fc => canvasTex(64, 64, (g,w,h) => {
  g.fillStyle = fc; g.fillRect(0,0,w,h);
  g.fillStyle = fc === '#f2eee4' ? '#1d2b45' : '#e8dcc0';
  g.fillRect(2, 4, 60, 9); // sign band
  g.fillStyle = fc === '#f2eee4' ? '#f2eee4' : fc;
  for (let x=6; x<58; x+= R(4,7)) g.fillRect(x, 6, R(2,4), 5);
  glass(g, 4, 17, 38, 40);
  g.fillStyle = fc; g.fillRect(22, 17, 2, 40);
  for (let i=0;i<5;i++) { g.fillStyle = `hsl(${R(0,360)},${R(30,70)}%,${R(35,70)}%)`; g.fillRect(R(6,36), R(40,52), R(3,6), R(4,8)); }
  g.fillStyle = '#3b2a1c'; g.fillRect(46, 20, 13, 44); glass(g, 48, 23, 9, 18);
  g.fillStyle = '#c9a24a'; g.fillRect(56, 44, 2, 2);
}, [1,1]));
const roofTex = ['#4a4e55', '#5d5348', '#3f454f', '#6b6259'].map(c => canvasTex(64, 64, (g,w,h) => {
  g.fillStyle = c; g.fillRect(0,0,w,h);
  for (let y=0;y<h;y+=4) for (let x=(y/4%2)*4;x<w;x+=8) { g.fillStyle = `rgba(0,0,0,${R(0,.3)})`; g.fillRect(x,y,7,3); }
  g.fillStyle = 'rgba(255,220,170,.08)'; for (let y=0;y<h;y+=4) g.fillRect(0,y,w,1);
}, [1,1]));
const flatTex = canvasTex(32, 32, (g,w,h) => { g.fillStyle = '#6a6a68'; g.fillRect(0,0,w,h); speckle(g,w,h,200,['#5a5a58','#7c7c78']); }, [1,1]);
function speckle(g,w,h,n,cols,s=1){ for (let i=0;i<n;i++){ g.fillStyle = pick(cols); g.fillRect(rnd()*w, rnd()*h, s, s); } }

// aerial with a land-green border so clamped edges stay green
const aerialCanvas = document.createElement('canvas'); aerialCanvas.width = AW; aerialCanvas.height = AH;
const ag = aerialCanvas.getContext('2d'); ag.drawImage(aerialImg, 0, 0);
const aerialData = ag.getImageData(0, 0, AW, AH).data;
const groundCanvas = document.createElement('canvas'); groundCanvas.width = AW; groundCanvas.height = AH;
const gg = groundCanvas.getContext('2d');
if (NOAERIAL) { gg.fillStyle = '#7d8f5c'; gg.fillRect(0,0,AW,AH); }
else { gg.drawImage(aerialImg, 0, 0); gg.fillStyle = 'rgba(255,190,110,.12)'; gg.fillRect(0,0,AW,AH); }
gg.strokeStyle = '#5f7a3e'; gg.lineWidth = 6; gg.strokeRect(0,0,AW,AH);
const groundTex = new THREE.CanvasTexture(groundCanvas); groundTex.colorSpace = THREE.SRGBColorSpace;
groundTex.magFilter = THREE.NearestFilter; groundTex.anisotropy = 8;

const AWN = [['#1d3f6e','#f4f0e6'],['#2f6b45','#f4f0e6'],['#a3262a','#f4f0e6'],['#1d3f6e','#1d3f6e'],['#c56a2a','#f6e6c8'],['#20202a','#20202a'],['#5b8db8','#ffffff']];
const awnTex = AWN.map(([a,b]) => canvasTex(16, 16, (g,w,h) => { g.fillStyle = a; g.fillRect(0,0,w,h); g.fillStyle = b; for (let x=0;x<w;x+=8) g.fillRect(x+4,0,4,h); g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(0,h-2,w,2); }, [1,1]));

// ---------- vertex hook: buildings breathe ----------
function breathing(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = U.uTime; sh.uniforms.uBreathe = U.uBreathe;
    sh.vertexShader = 'attribute vec4 bc; uniform float uTime, uBreathe;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      float br = uBreathe * sin(uTime*2.6 + bc.z);
      float hy = clamp(transformed.y / max(bc.w, 1.), 0., 1.6);
      transformed.xz = bc.xy + (transformed.xz - bc.xy) * (1. + .10*br*hy);
      transformed.y *= 1. + .16*br;`);
  };
  return mat;
}
const depthMat = breathing(new THREE.MeshDepthMaterial({depthPacking: THREE.RGBADepthPacking}));

// ---------- geometry buckets (merged per material) ----------
const buckets = new Map();
function bucket(key, mkMat) {
  if (!buckets.has(key)) buckets.set(key, {mat: mkMat(), pos: [], uv: [], bc: [], nrm: []});
  return buckets.get(key);
}
function tri(b, a, c, d, ua, uc, ud, bc, hint) {
  const e1 = [c[0]-a[0], c[1]-a[1], c[2]-a[2]], e2 = [d[0]-a[0], d[1]-a[1], d[2]-a[2]];
  let n = [e1[1]*e2[2]-e1[2]*e2[1], e1[2]*e2[0]-e1[0]*e2[2], e1[0]*e2[1]-e1[1]*e2[0]];
  if (hint && n[0]*hint[0]+n[1]*hint[1]+n[2]*hint[2] < 0) { [c, d] = [d, c]; [uc, ud] = [ud, uc]; n = n.map(v => -v); }
  const l = Math.hypot(...n) || 1; n = n.map(v => v/l);
  for (const [p, u] of [[a,ua],[c,uc],[d,ud]]) { b.pos.push(...p); b.uv.push(...u); b.bc.push(...bc); b.nrm.push(...n); }
}
const quad = (b, p0, p1, p2, p3, u0, u1, u2, u3, bc, hint) => { tri(b, p0, p1, p2, u0, u1, u2, bc, hint); tri(b, p0, p2, p3, u0, u2, u3, bc, hint); };

// ---------- helpers ----------
const mainSt = D.roads.filter(r => r.n === 'Main Street').map(r => r.p);
function distToLines(x, z, lines) {
  let best = 1e9;
  for (const L of lines) for (let i=0;i<L.length-1;i++) {
    const [ax,az] = L[i], [bx,bz] = L[i+1], dx = bx-ax, dz = bz-az;
    const t = Math.max(0, Math.min(1, ((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz || 1)));
    best = Math.min(best, Math.hypot(x-ax-t*dx, z-az-t*dz));
  }
  return best;
}
function inPoly(x, z, P) {
  let c = false;
  for (let i=0, j=P.length-1; i<P.length; j=i++) {
    const [xi,zi] = P[i], [xj,zj] = P[j];
    if ((zi>z) !== (zj>z) && x < (xj-xi)*(z-zi)/(zj-zi)+xi) c = !c;
  }
  return c;
}
function obb(P) {
  let best = null;
  for (let i=0;i<P.length;i++) {
    const [ax,az] = P[i], [bx,bz] = P[(i+1)%P.length];
    const l = Math.hypot(bx-ax, bz-az); if (l < 0.5) continue;
    const ux = (bx-ax)/l, uz = (bz-az)/l;
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for (const [x,z] of P) { const a = x*ux+z*uz, b = -x*uz+z*ux; a0=Math.min(a0,a); a1=Math.max(a1,a); b0=Math.min(b0,b); b1=Math.max(b1,b); }
    const area = (a1-a0)*(b1-b0);
    if (!best || area < best.area) best = {area, ux, uz, a0, a1, b0, b1};
  }
  let {ux, uz, a0, a1, b0, b1} = best;
  if (a1-a0 < b1-b0) { [ux, uz] = [-uz, ux]; [a0, a1, b0, b1] = [b0, b1, -a1, -a0]; }
  const ca = (a0+a1)/2, cb = (b0+b1)/2;
  return {ux, uz, vx: -uz, vz: ux, cx: ca*ux - cb*uz, cz: ca*uz + cb*ux, ha: (a1-a0)/2, hb: (b1-b0)/2};
}

// ---------- buildings ----------
const cinemaPOI = D.pois.find(p => /Cinema/.test(p.n)).p;
const FLOOR = 3.2;
const special = {};
let nBuild = 0;
for (const B of D.buildings) {
  let P = B.p.slice(0, -1);
  if (P.length < 3) continue;
  let A = 0; for (let i=0;i<P.length;i++){ const [x1,z1]=P[i],[x2,z2]=P[(i+1)%P.length]; A += x1*z2-x2*z1; }
  A /= 2; if (A > 0) P.reverse();
  const area = Math.abs(A);
  let cx=0, cz=0; for (const [x,z] of P){cx+=x;cz+=z;} cx/=P.length; cz/=P.length;
  const dMain = distToLines(cx, cz, mainSt);
  const onMain = dMain < 32 && cz > -40 && cz < 420;
  const isCinema = inPoly(cinemaPOI[0], cinemaPOI[1], P);
  const k = B.k;
  let floors;
  if (B.lv) floors = +B.lv;
  else if (k === 'garage' || k === 'shed' || area < 30) floors = 1;
  else if (k === 'church' || k === 'synagogue') floors = 3;
  else if (onMain && (k === 'commercial' || k === 'retail' || k === 'yes')) floors = pick([2, 2, 3, 3]);
  else if (k === 'house') floors = pick([2, 2, 2, 1.5, 2.5]);
  else floors = 2;
  const wallH = B.h ? +B.h * 0.75 : floors * FLOOR;
  const commercial = onMain && k !== 'house' && k !== 'garage' && k !== 'shed';
  const flatRoof = (commercial && rnd() < 0.55) || k === 'industrial' || (k === 'commercial' && area > 600) || isCinema || area > 1500;
  const sid = B.n === 'American Hotel' ? 6 : isCinema ? 7 : (k === 'garage' || k === 'shed') ? pick([0, 2, 3]) : pick([0,0,0,1,1,2,2,3,4,5,6,7,8].slice(0, commercial ? 13 : 12));
  const ob = obb(P);
  const roofH = flatRoof ? 0 : Math.min(ob.hb * 0.75, 7);
  const bc = [cx, cz, R(0, 6.283), wallH + roofH];
  const wb = bucket('w'+sid, () => breathing(new THREE.MeshLambertMaterial({map: wallTex[sid]})));
  const st = commercial ? (isCinema ? 2 : (nBuild % STORE.length)) : -1;
  const sb = st >= 0 ? bucket('s'+st, () => breathing(new THREE.MeshLambertMaterial({map: storeTex[st]}))) : null;
  let run = 0;
  for (let i=0;i<P.length;i++) {
    const [ax,az] = P[i], [bx,bz] = P[(i+1)%P.length];
    const L = Math.hypot(bx-ax, bz-az), u0 = Math.round(run/3), u1 = u0 + Math.max(1, Math.round(L/3)); run += L;
    const y0 = sb ? FLOOR*1.15 : 0;
    if (sb) quad(sb, [ax,0,az],[bx,0,bz],[bx,y0,bz],[ax,y0,az], [u0,0],[u1,0],[u1,1],[u0,1], bc);
    const vv = (wallH - y0)/FLOOR;
    quad(wb, [ax,y0,az],[bx,y0,bz],[bx,wallH,bz],[ax,wallH,az], [u0,0],[u1,0],[u1,vv],[u0,vv], bc);
  }
  if (flatRoof) {
    const fb = bucket('flat', () => breathing(new THREE.MeshLambertMaterial({map: flatTex})));
    const idx = THREE.ShapeUtils.triangulateShape(P.map(([x,z]) => new THREE.Vector2(x,z)), []);
    for (const [i,j,m] of idx) tri(fb, [P[i][0],wallH,P[i][1]], [P[j][0],wallH,P[j][1]], [P[m][0],wallH,P[m][1]], [P[i][0]/4,P[i][1]/4],[P[j][0]/4,P[j][1]/4],[P[m][0]/4,P[m][1]/4], bc, [0,1,0]);
    // cornice
    if (commercial || isCinema) for (let i=0;i<P.length;i++) {
      const [ax,az] = P[i], [bx,bz] = P[(i+1)%P.length], L = Math.hypot(bx-ax,bz-az) || 1;
      const nx = -(bz-az)/L*0.35, nz = (bx-ax)/L*0.35;
      const tb = bucket('w0', () => breathing(new THREE.MeshLambertMaterial({map: wallTex[0]})));
      quad(tb, [ax+nx,wallH-0.5,az+nz],[bx+nx,wallH-0.5,bz+nz],[bx+nx,wallH+0.6,bz+nz],[ax+nx,wallH+0.6,az+nz], [0,.1],[.2,.1],[.2,.2],[0,.2], bc, [nx,0,nz]);
    }
  } else {
    const rk = 'r' + (nBuild % 4);
    const rb = bucket(rk, () => breathing(new THREE.MeshLambertMaterial({map: roofTex[nBuild % 4]})));
    const o = 0.45, a = ob.ha + o, b2 = ob.hb + o;
    const C = (sa, sb2, y) => [ob.cx + ob.ux*sa + ob.vx*sb2, y, ob.cz + ob.uz*sa + ob.vz*sb2];
    const p1 = C(-a,-b2,wallH-0.2), p2 = C(a,-b2,wallH-0.2), p3 = C(a,b2,wallH-0.2), p4 = C(-a,b2,wallH-0.2);
    const r1 = C(-a,0,wallH+roofH), r2 = C(a,0,wallH+roofH);
    const ua = a*2/3, sl = Math.hypot(b2, roofH)/3;

// ---------- camera path: Main Street centerline from OSM, then Long Wharf ----------
const PATH = [[10,334],[15,330],[19,326],[22,319],[25,306],[28,288],[30,272],[35,238],[36,230],[37,222],[38,212],[38,175],[37,165],[36,160],[34,150],[32,145],[30,139],[27,132],[15,98],[13,93],[6,73],[2,62],[-1,54],[-2,38],[-3,26],[-3,19],[-2,13],[-1,6],[0,0],[2,-8],[4,-14],[8,-50],[10,-83],[12,-108],[16,-175],[18,-215]];
const cum = [0]; for (let i=1;i<PATH.length;i++) cum.push(cum[i-1] + Math.hypot(PATH[i][0]-PATH[i-1][0], PATH[i][1]-PATH[i-1][1]));
function along(d) {
  d = Math.max(0, Math.min(cum[cum.length-1], d));
  let i = 1; while (i < cum.length-1 && cum[i] < d) i++;
  const t = (d - cum[i-1]) / (cum[i] - cum[i-1]);
  return [PATH[i-1][0] + (PATH[i][0]-PATH[i-1][0])*t, PATH[i-1][1] + (PATH[i][1]-PATH[i-1][1])*t];
}
const dAtZ = z => { for (let d=0; d<cum[cum.length-1]; d+=0.5) if (along(d)[1] < z) return d; return cum[cum.length-1]; };
// distance keys (seconds -> meters along the path)
const KEYS = [[0, dAtZ(300)], [4, dAtZ(282)], [8, dAtZ(262)], [12, dAtZ(254)], [15.2, dAtZ(249)], [16, dAtZ(-14)], [20, dAtZ(-85)], [21.5, dAtZ(-150)], [30, dAtZ(-205)]];
function dist(t) { for (let i=1;i<KEYS.length;i++) if (t <= KEYS[i][0]) { const [t0,d0] = KEYS[i-1], [t1,d1] = KEYS[i]; const u = (t-t0)/(t1-t0); return d0 + (d1-d0)*(i===5 ? smooth(0,1,u) : u); } return KEYS[KEYS.length-1][1]; }
const lerp = (a,b,u) => a + (b-a)*u;
function angLerp(a, b, u) { let d = ((b - a + Math.PI*3) % (Math.PI*2)) - Math.PI; return a + d*u; }
function setCamera(t) {
  const d = dist(t), [x, z] = along(d), [x2, z2] = along(d + 6);
  let yaw = Math.atan2(x2 - x, z2 - z), pitch = -0.035;
  const bob = Math.sin(t*2*Math.PI*0.9)*0.035;
  // 8-12: look left at the marquee
  const [cmx, cmz] = cinemaAt;
  const yawCin = Math.atan2(cmx - x, cmz - z);
  const wc = smooth(7.2, 9.2, t) * (1 - smooth(11.6, 12.6, t));
  yaw = angLerp(yaw, yawCin, wc*0.88); pitch = lerp(pitch, 0.13, wc);
  // 12-16: turn round to the steeple and tilt up into the kaleidoscope sky (glide happens while looking up)
  const [sx, sz] = steepleAt;
  const yawSt = Math.atan2(sx - x, sz - z);
  const ws = smooth(12, 12.8, t) * (1 - smooth(15.4, 16, t));
  yaw = angLerp(yaw, yawSt, ws);
  pitch = lerp(pitch, lerp(0.3, 0.62, smooth(12.8, 14.6, t)), ws);
  pitch = lerp(pitch, 1.45, smooth(15.0, 15.5, t)*(1 - smooth(15.8, 16.5, t)));
  // 16-20: windmill on the left
  const wm = windmill.position, yawW = Math.atan2(wm.x - x, wm.z - z);
  const ww = smooth(16, 16.8, t) * (1 - smooth(19.2, 20.5, t));
  yaw = angLerp(yaw, yawW, ww*0.8); pitch = lerp(pitch, 0.18, ww);
  // 20-27: whale
  const yawWh = Math.atan2(WHALE_AT.x - x, WHALE_AT.z - z);
  const wh = smooth(20, 21, t);
  yaw = angLerp(yaw, yawWh, wh); pitch = lerp(pitch, 0.12 + 0.12*smooth(22, 25, t), wh);
  // 27-30: drift up into the rain
  const up = smooth(27, 30, t)*6;
  // walk on the east sidewalk of Main Street, drift back to the middle on the wharf
  const sw = 6.4*(1 - smooth(15.2, 16, t)) + 2.0*smooth(16, 17, t);
  const fx = x2 - x, fz = z2 - z, fl = Math.hypot(fx, fz) || 1;
  const ox = -fz/fl*sw, oz = fx/fl*sw;
  camera.position.set(x + ox, 1.65 + bob + up, z + oz);
  camera.rotation.set(0, 0, 0); camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw + Math.PI; camera.rotation.x = pitch;
  return [x, z];
}

const finalMat = new THREE.ShaderMaterial({
  uniforms: {src: {value: null}, ...U, uFlash: {value: 0}},
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D src; uniform float uTrip, uTime, uFlash; varying vec2 vUv;
    vec3 pal(float t){ return .5+.5*cos(6.2832*(t+vec3(0.,.33,.67))); }
    float bay(vec2 p){ ivec2 q = ivec2(mod(p, 4.)); int i = q.x + q.y*4;
      float m[16]; m[0]=0.;m[1]=8.;m[2]=2.;m[3]=10.;m[4]=12.;m[5]=4.;m[6]=14.;m[7]=6.;m[8]=3.;m[9]=11.;m[10]=1.;m[11]=9.;m[12]=15.;m[13]=7.;m[14]=13.;m[15]=5.;
      for (int k=0;k<16;k++) if (k==i) return m[k]/16.; return 0.; }
    void main(){
      vec2 uv = vUv;
      uv.x += sin(uv.y*18. + uTime*2.)*.004*uTrip;
      vec3 c = pow(texture2D(src, uv).rgb, vec3(1./2.2));
      float l = dot(c, vec3(.299,.587,.114));
      vec3 dye = pal(l*1.3 + sin(uv.x*3.+uTime*.7)*.2 + cos(uv.y*2.5-uTime*.5)*.2 - uTime*.15);
      c = mix(c, c*.55 + dye*(.25+.6*l), uTrip*.45);
      c = mix(vec3(l), c, 1. + uTrip*.7);
      c = mix(c, vec3(1.), uFlash);
      // warm golden grade + slight vignette
      c *= vec3(1.04, 1., .93);
      float v = smoothstep(1.1, .35, length(vUv-.5)); c *= mix(.78, 1., v);
      c = floor(c*28. + bay(gl_FragCoord.xy)) / 28.;
      gl_FragColor = vec4(c, 1.); }`,
});
const quadM = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blendMat); postScene.add(quadM);
let acc = [rtA, rtB], lastT = -99;

function updateWorld(t) {
  U.uTime.value = t;
  U.uBreathe.value = smooth(4, 5.5, t) * (1 - smooth(26, 28, t)) * (0.6 + 0.4*smooth(8, 12, t));
  U.uDrip.value = smooth(8.6, 11.8, t) * (1 - smooth(15, 17, t)) + 0.15*smooth(17, 20, t);
  U.uKal.value = smooth(12.8, 14.6, t) * (1 - smooth(15.6, 16.4, t)) + 0.25*smooth(16.4, 20, t);
  U.uTrip.value = smooth(4, 8, t)*0.32 + smooth(12, 16, t)*0.18 + smooth(20, 24, t)*0.08;
  const [cx, cz] = setCamera(t);
  // sun follows camera for shadows
  sun.position.set(cx + sunDir.x*400, sunDir.y*400, cz + sunDir.z*400); sun.target.position.set(cx, 0, cz - 60);
  // marquee drops
  {
    const p = marquee.drops.geometry.attributes.position, dr = U.uDrip.value;
    marquee.seeds.forEach(([sx, ph, sp], i) => { const f = ((t*sp*0.35 + ph) % 1); p.setXYZ(i, sx*marquee.fw, 4.4 - f*4.4*Math.min(1, dr*2), 2.42 + 0.05*i%1); });
    p.needsUpdate = true; marquee.drops.visible = dr > 0.05;
  }
  // steeple stretch + twist
  const st = smooth(12.6, 15.2, t) * (1 - smooth(16, 18, t));
  steeple.scale.set(1 + 2.6*st, 1 + 5.5*st, 1 + 2.6*st); steeple.rotation.y = st*t*0.9;
  steeple.userData.mat.color.setHSL((t*0.35) % 1, 0.85*st, 0.94 - 0.3*st);
  // windmill: slow turn, then rainbow pinwheel
  const pw = smooth(16.3, 17.8, t);
  const {hub, sails, blades} = windmill.userData;
  hub.rotation.z = -(t*0.5 + pw*Math.pow(Math.max(0, t-16.3), 1.6)*1.6);
  hub.scale.setScalar(1 + pw*1.4);
  sails.forEach(s => s.visible = pw < 0.5); blades.forEach(b => b.visible = pw >= 0.5);
  // whale
  const wr = smooth(20.2, 24.5, t), arc = Math.sin(Math.min(1, Math.max(0, (t-20.2)/7))*Math.PI);
  whale.position.set(WHALE_AT.x, lerp(-30, 16, wr) - 6*smooth(25, 28, t) + Math.sin(t*1.3)*0.5, WHALE_AT.z);
  whale.rotation.order = 'YXZ';
  whale.rotation.set(lerp(1.15, 0.7, wr) + 0.08*Math.sin(t*0.9), Math.PI*0.62 + Math.sin(t*0.5)*0.08, Math.sin(t*0.8)*0.06);
  whale.scale.setScalar(2.4);
  whale.visible = t > 19.5;
  const ring = whale.userData.ring; ring.position.set(WHALE_AT.x, -0.4, WHALE_AT.z); ring.visible = t > 20 && t < 27; ring.scale.setScalar(1 + (t-20)*0.35); ring.material.opacity = Math.max(0, 0.7 - (t-20)*0.1);
  {
    const sp = spout.geometry.attributes.position, on = smooth(22.5, 23.3, t)*(1 - smooth(28, 29, t));
    const head = new THREE.Vector3(0, 3.6, 5).multiplyScalar(2.4).applyEuler(whale.rotation).add(whale.position);
    spout.userData.seeds.forEach(([ph, a, r, v], i) => {
      const age = ((t*0.6 + ph) % 1) * 2.2;
      const x = Math.cos(a)*r*age*3, z = Math.sin(a)*r*age*3, y = v*age - 9.8*age*age*0.5;
      sp.setXYZ(i, head.x + x, head.y + Math.max(y, -3), head.z + z);
    });
    sp.needsUpdate = true; spout.visible = on > 0.02; spout.material.size = 0.9*on + 0.1;
  }
  // rain
  const rn = smooth(26.5, 27.6, t);
  rain.visible = rn > 0.01;
  if (rain.visible) {
    const p = rain.geometry.attributes.position, c = camera.position;
    rain.userData.s.forEach(([x, z, ph, sp], i) => {
      if (i/RAIN_N > rn) { p.setXYZ(i*2, 0, -999, 0); p.setXYZ(i*2+1, 0, -999, 0); return; }
      const y = 30 - ((t*sp + ph*40) % 40);
      p.setXYZ(i*2, c.x + x, c.y + y, c.z + z); p.setXYZ(i*2+1, c.x + x, c.y + y + 1.8, c.z + z);
    });
    p.needsUpdate = true;
  }
  finalMat.uniforms.uFlash.value = smooth(29.3, 30, t)*0.85;
}

function draw(t, trail) {
  updateWorld(t);
  renderer.setRenderTarget(rtS); renderer.render(scene, camera);
  quadM.material = blendMat; blendMat.uniforms.cur.value = rtS.texture; blendMat.uniforms.prev.value = acc[0].texture; blendMat.uniforms.trail.value = trail;
  renderer.setRenderTarget(acc[1]); renderer.render(postScene, postCam);
  acc = [acc[1], acc[0]];
}
const trailAt = t => 0.55*smooth(4, 6, t)*(1 - smooth(26, 28, t))*(1 - 0.9*smooth(15, 15.3, t)*(1 - smooth(16, 16.6, t)));

window.renderAt = (t) => {
  if (OVERHEAD) return renderOverhead();
  const tr = trailAt(t);
  if (tr > 0.01 && Math.abs(t - lastT - 1/30) > 1e-4) {
    // warm up the trail history so stills match a running render
    for (let k = 14; k >= 1; k--) draw(t - k/30, trailAt(t - k/30));
  }
  draw(t, tr); lastT = t;
  quadM.material = finalMat; finalMat.uniforms.src.value = acc[0].texture;
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  return renderer.domElement.toDataURL('image/png');
};

// overhead orthographic view of the same window as the aerial crop
const OV = (Q.get('ov') || '-240,-330,300,630').split(',').map(Number);
function renderOverhead() {
  updateWorld(0);
  scene.fog = null; sky.visible = false; whale.visible = false; spout.visible = false;
  const oc = new THREE.OrthographicCamera(OV[0], OV[2], -OV[1], -OV[3], 1, 2000);
  oc.position.set(0, 800, 0); oc.up.set(0, 0, -1); oc.lookAt(0, 0, 0);
  sun.position.set(sunDir.x*400, sunDir.y*400 + 300, sunDir.z*400); sun.target.position.set(0, 0, 0);
  renderer.setRenderTarget(null); renderer.render(scene, oc);
  return renderer.domElement.toDataURL('image/png');
}
window.dbg = t => { setCamera(t); return {cam: camera.position.toArray().map(v=>+v.toFixed(1)), cin: cinemaAt.map(v=>+v.toFixed(2)), st: steepleAt, cinP: special.cinema.P}; };
window.ready = true;

</script>
